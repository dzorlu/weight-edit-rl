<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"><title>Two edits to layer 2: zeroing unit 2's row removes its contribution; removing direction u from every row makes s zero for all units</title><style>
text{font-family:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink,#1d1d1b)}
.s{font-size:13px}.tiny{font-size:11.5px;fill:var(--muted,#5f5e5a)}.num{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
.code{font-size:13px;font-family:ui-monospace,Menlo,monospace}.h{font-size:14px;font-weight:600}.op{font-size:17px;font-weight:600}
.stream{stroke:var(--muted,#5f5e5a);stroke-width:3}.ar{stroke:var(--muted,#5f5e5a);stroke-width:1.4;fill:none}.hd{fill:var(--muted,#5f5e5a)}
.axis{stroke:var(--muted,#5f5e5a);stroke-width:1}.box{fill:none;stroke:var(--muted,#5f5e5a);stroke-width:1.2}
.sel{fill:none;stroke:var(--accent,#2a78d6);stroke-width:2.2}.addc{fill:var(--bg,#fff);stroke:var(--muted,#5f5e5a);stroke-width:1.4}
.pos{fill:var(--pos,#2a6fc9)}.neg{fill:var(--neg,#d2601f)}.zero{fill:var(--code,#e9e8e4);stroke:var(--line,#d9d7d1);stroke-width:.6}
.gray{fill:var(--muted,#5f5e5a)}
</style>
<defs><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hd"/></marker></defs><text x="0" y="20" class="h" text-anchor="start" xml:space="preserve">An edit changes s = W @ u, so it changes every contribution that uses it</text><text x="0" y="42" class="tiny" text-anchor="start" xml:space="preserve">Layer 2 only. x2 = [0, 1, 3] stays the same; layer 1 and the embedding still give 2.</text><text x="0" y="76" class="h" text-anchor="start" xml:space="preserve">original</text><rect x="0" y="88" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="18.0" y="105.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="40" y="88" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="58.0" y="105.0" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="86" y="105" class="tiny" text-anchor="start" xml:space="preserve">row 0</text><rect x="0" y="118" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="18.0" y="135.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="40" y="118" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="58.0" y="135.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="86" y="135" class="tiny" text-anchor="start" xml:space="preserve">row 1</text><rect x="0" y="148" width="36" height="26" rx="2" class="pos" fill-opacity="0.48"/><text x="18.0" y="165.0" class="num" text-anchor="middle" xml:space="preserve">0.5</text><rect x="40" y="148" width="36" height="26" rx="2" class="neg" fill-opacity="0.48"/><text x="58.0" y="165.0" class="num" text-anchor="middle" xml:space="preserve">−0.5</text><text x="86" y="165" class="tiny" text-anchor="start" xml:space="preserve">row 2</text><text x="0" y="200" class="code" text-anchor="start" xml:space="preserve">s2 = W2 @ u = [0, 1, 0.5]</text><text x="0" y="227" class="tiny" text-anchor="start" xml:space="preserve">unit 0</text><rect x="46" y="214" width="1.5" height="16" rx="2" class="zero" fill-opacity="0.85"/><text x="52.0" y="227" class="num" text-anchor="start" xml:space="preserve">0</text><text x="0" y="251" class="tiny" text-anchor="start" xml:space="preserve">unit 1</text><rect x="46" y="238" width="48.0" height="16" rx="2" class="pos" fill-opacity="0.85"/><text x="100.0" y="251" class="num" text-anchor="start" xml:space="preserve">1</text><text x="0" y="275" class="tiny" text-anchor="start" xml:space="preserve">unit 2</text><rect x="46" y="262" width="72.0" height="16" rx="2" class="pos" fill-opacity="0.85"/><text x="124.0" y="275" class="num" text-anchor="start" xml:space="preserve">1.5</text><line x1="46" y1="210" x2="46" y2="286" class="axis"/><text x="0" y="310" class="s" text-anchor="start" xml:space="preserve">layer 2 part = 2.5</text><text x="0" y="330" class="s" text-anchor="start" xml:space="preserve">logit(Wait) = 4.5</text><text x="250" y="76" class="h" text-anchor="start" xml:space="preserve">zero unit 2</text><rect x="250" y="88" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="268.0" y="105.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="290" y="88" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="308.0" y="105.0" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="336" y="105" class="tiny" text-anchor="start" xml:space="preserve">row 0</text><rect x="250" y="118" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="268.0" y="135.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="290" y="118" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="308.0" y="135.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="336" y="135" class="tiny" text-anchor="start" xml:space="preserve">row 1</text><rect x="250" y="148" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="268.0" y="165.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="290" y="148" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="308.0" y="165.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="336" y="165" class="tiny" text-anchor="start" xml:space="preserve">row 2</text><rect x="246" y="144" width="84" height="34" rx="4" class="sel"/><text x="250" y="200" class="code" text-anchor="start" xml:space="preserve">s2 = W2 @ u = [0, 1, 0]</text><text x="250" y="227" class="tiny" text-anchor="start" xml:space="preserve">unit 0</text><rect x="296" y="214" width="1.5" height="16" rx="2" class="zero" fill-opacity="0.85"/><text x="302.0" y="227" class="num" text-anchor="start" xml:space="preserve">0</text><text x="250" y="251" class="tiny" text-anchor="start" xml:space="preserve">unit 1</text><rect x="296" y="238" width="48.0" height="16" rx="2" class="pos" fill-opacity="0.85"/><text x="350.0" y="251" class="num" text-anchor="start" xml:space="preserve">1</text><text x="250" y="275" class="tiny" text-anchor="start" xml:space="preserve">unit 2</text><rect x="296" y="262" width="1.5" height="16" rx="2" class="zero" fill-opacity="0.85"/><text x="302.0" y="275" class="num" text-anchor="start" xml:space="preserve">0</text><line x1="296" y1="210" x2="296" y2="286" class="axis"/><text x="250" y="310" class="s" text-anchor="start" xml:space="preserve">layer 2 part = 1</text><text x="250" y="330" class="s" text-anchor="start" xml:space="preserve">logit(Wait) = 3</text><text x="500" y="76" class="h" text-anchor="start" xml:space="preserve">remove direction u</text><rect x="500" y="88" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="518.0" y="105.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="540" y="88" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="558.0" y="105.0" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="586" y="105" class="tiny" text-anchor="start" xml:space="preserve">row 0</text><rect x="500" y="118" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="518.0" y="135.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="540" y="118" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="558.0" y="135.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="586" y="135" class="tiny" text-anchor="start" xml:space="preserve">row 1</text><rect x="500" y="148" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="518.0" y="165.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="540" y="148" width="36" height="26" rx="2" class="neg" fill-opacity="0.48"/><text x="558.0" y="165.0" class="num" text-anchor="middle" xml:space="preserve">−0.5</text><text x="586" y="165" class="tiny" text-anchor="start" xml:space="preserve">row 2</text><rect x="496" y="84" width="44" height="94" rx="4" class="sel"/><text x="500" y="200" class="code" text-anchor="start" xml:space="preserve">s2 = W2 @ u = [0, 0, 0]</text><text x="500" y="227" class="tiny" text-anchor="start" xml:space="preserve">unit 0</text><rect x="546" y="214" width="1.5" height="16" rx="2" class="zero" fill-opacity="0.85"/><text x="552.0" y="227" class="num" text-anchor="start" xml:space="preserve">0</text><text x="500" y="251" class="tiny" text-anchor="start" xml:space="preserve">unit 1</text><rect x="546" y="238" width="1.5" height="16" rx="2" class="zero" fill-opacity="0.85"/><text x="552.0" y="251" class="num" text-anchor="start" xml:space="preserve">0</text><text x="500" y="275" class="tiny" text-anchor="start" xml:space="preserve">unit 2</text><rect x="546" y="262" width="1.5" height="16" rx="2" class="zero" fill-opacity="0.85"/><text x="552.0" y="275" class="num" text-anchor="start" xml:space="preserve">0</text><line x1="546" y1="210" x2="546" y2="286" class="axis"/><text x="500" y="310" class="s" text-anchor="start" xml:space="preserve">layer 2 part = 0</text><text x="500" y="330" class="s" text-anchor="start" xml:space="preserve">logit(Wait) = 2</text><text x="0" y="368" class="tiny" text-anchor="start" xml:space="preserve">Zeroing a row sets one entry of s to 0. Removing direction u, W − (W @ u) uᵀ, sets every entry of s to 0:</text><text x="0" y="386" class="tiny" text-anchor="start" xml:space="preserve">layer 2 can no longer change the "Wait" logit at all, whatever its activations.</text></svg>
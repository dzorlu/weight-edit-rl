<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img"><title>A two-layer network: activations x feed each layer's output matrix W; the outputs m are added to the residual stream; U turns the final vector into one logit per token</title><style>
text{font-family:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink,#1d1d1b)}
.s{font-size:13px}.tiny{font-size:11.5px;fill:var(--muted,#5f5e5a)}.num{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
.code{font-size:13px;font-family:ui-monospace,Menlo,monospace}.h{font-size:14px;font-weight:600}.op{font-size:17px;font-weight:600}
.stream{stroke:var(--muted,#5f5e5a);stroke-width:3}.ar{stroke:var(--muted,#5f5e5a);stroke-width:1.4;fill:none}.hd{fill:var(--muted,#5f5e5a)}
.axis{stroke:var(--muted,#5f5e5a);stroke-width:1}.box{fill:none;stroke:var(--muted,#5f5e5a);stroke-width:1.2}
.sel{fill:none;stroke:var(--accent,#2a78d6);stroke-width:2.2}.addc{fill:var(--bg,#fff);stroke:var(--muted,#5f5e5a);stroke-width:1.4}
.pos{fill:var(--pos,#2a6fc9)}.neg{fill:var(--neg,#d2601f)}.zero{fill:var(--code,#e9e8e4);stroke:var(--line,#d9d7d1);stroke-width:.6}
.gray{fill:var(--muted,#5f5e5a)}
</style>
<defs><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hd"/></marker></defs><text x="200" y="20" class="h" text-anchor="middle" xml:space="preserve">residual stream</text><rect x="138" y="32" width="124" height="30" rx="5" class="box"/><text x="200" y="52" class="code" text-anchor="middle" xml:space="preserve">h0 = [1, 0]</text><text x="130" y="51" class="tiny" text-anchor="end" xml:space="preserve">embedding</text><line x1="200" y1="62" x2="200" y2="472" class="stream"/><text x="330" y="86" class="h" text-anchor="start" xml:space="preserve">layer 1 MLP</text><path d="M 200 133 L 324 133" class="ar" stroke-dasharray="4 3" marker-end="url(#hd)"/><text x="266" y="126" class="tiny" text-anchor="middle" xml:space="preserve">gate, up</text><text x="330" y="104" class="tiny" text-anchor="start" xml:space="preserve">x1 [3]: activations</text><rect x="330" y="120" width="32" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="346.0" y="137.0" class="num" text-anchor="middle" xml:space="preserve">2</text><text x="346" y="162" class="tiny" text-anchor="middle" xml:space="preserve">unit 0</text><rect x="366" y="120" width="32" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="382.0" y="137.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="382" y="162" class="tiny" text-anchor="middle" xml:space="preserve">unit 1</text><rect x="402" y="120" width="32" height="26" rx="2" class="neg" fill-opacity="0.48"/><text x="418.0" y="137.0" class="num" text-anchor="middle" xml:space="preserve">−1</text><text x="418" y="162" class="tiny" text-anchor="middle" xml:space="preserve">unit 2</text><line x1="438" y1="133" x2="472" y2="133" class="ar" marker-end="url(#hd)"/><rect x="478" y="98" width="96" height="102" rx="6" class="box"/><text x="526" y="92" class="s" text-anchor="middle" xml:space="preserve">W1 [3 × 2]</text><rect x="488" y="106" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="506.0" y="123.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="528" y="106" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="546.0" y="123.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="578" y="123" class="tiny" text-anchor="start" xml:space="preserve">row 0</text><rect x="488" y="136" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="506.0" y="153.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="528" y="136" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="546.0" y="153.0" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="578" y="153" class="tiny" text-anchor="start" xml:space="preserve">row 1</text><rect x="488" y="166" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="506.0" y="183.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="528" y="166" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="546.0" y="183.0" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="578" y="183" class="tiny" text-anchor="start" xml:space="preserve">row 2</text><line x1="526" y1="200" x2="526" y2="224" class="ar" marker-end="url(#hd)"/><text x="536" y="220" class="code" text-anchor="start" xml:space="preserve">m1 = x1 @ W1 = [1, −1]</text><path d="M 526 234 C 526 254, 380 254, 213 254" class="ar" marker-end="url(#hd)"/><circle cx="200" cy="254" r="11" class="addc"/><text x="200" y="260" class="op" text-anchor="middle" xml:space="preserve">+</text><text x="182" y="278" class="code" text-anchor="end" xml:space="preserve">h1 = [2, −1]</text><text x="330" y="266" class="h" text-anchor="start" xml:space="preserve">layer 2 MLP</text><path d="M 200 313 L 324 313" class="ar" stroke-dasharray="4 3" marker-end="url(#hd)"/><text x="266" y="306" class="tiny" text-anchor="middle" xml:space="preserve">gate, up</text><text x="330" y="284" class="tiny" text-anchor="start" xml:space="preserve">x2 [3]: activations</text><rect x="330" y="300" width="32" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="346.0" y="317.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="346" y="342" class="tiny" text-anchor="middle" xml:space="preserve">unit 0</text><rect x="366" y="300" width="32" height="26" rx="2" class="pos" fill-opacity="0.48"/><text x="382.0" y="317.0" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="382" y="342" class="tiny" text-anchor="middle" xml:space="preserve">unit 1</text><rect x="402" y="300" width="32" height="26" rx="2" class="pos" fill-opacity="1.00"/><text x="418.0" y="317.0" class="num" text-anchor="middle" xml:space="preserve">3</text><text x="418" y="342" class="tiny" text-anchor="middle" xml:space="preserve">unit 2</text><line x1="438" y1="313" x2="472" y2="313" class="ar" marker-end="url(#hd)"/><rect x="478" y="278" width="96" height="102" rx="6" class="box"/><text x="526" y="272" class="s" text-anchor="middle" xml:space="preserve">W2 [3 × 2]</text><rect x="488" y="286" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="506.0" y="303.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="528" y="286" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="546.0" y="303.0" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="578" y="303" class="tiny" text-anchor="start" xml:space="preserve">row 0</text><rect x="488" y="316" width="36" height="26" rx="2" class="pos" fill-opacity="0.74"/><text x="506.0" y="333.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="528" y="316" width="36" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="546.0" y="333.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="578" y="333" class="tiny" text-anchor="start" xml:space="preserve">row 1</text><rect x="488" y="346" width="36" height="26" rx="2" class="pos" fill-opacity="0.48"/><text x="506.0" y="363.0" class="num" text-anchor="middle" xml:space="preserve">0.5</text><rect x="528" y="346" width="36" height="26" rx="2" class="neg" fill-opacity="0.48"/><text x="546.0" y="363.0" class="num" text-anchor="middle" xml:space="preserve">−0.5</text><text x="578" y="363" class="tiny" text-anchor="start" xml:space="preserve">row 2</text><line x1="526" y1="380" x2="526" y2="404" class="ar" marker-end="url(#hd)"/><text x="536" y="400" class="code" text-anchor="start" xml:space="preserve">m2 = x2 @ W2 = [2.5, −1.5]</text><path d="M 526 414 C 526 434, 380 434, 213 434" class="ar" marker-end="url(#hd)"/><circle cx="200" cy="434" r="11" class="addc"/><text x="200" y="440" class="op" text-anchor="middle" xml:space="preserve">+</text><text x="182" y="458" class="code" text-anchor="end" xml:space="preserve">h2 = [4.5, −2.5]</text><line x1="200" y1="472" x2="200" y2="502" class="ar" marker-end="url(#hd)"/><rect x="138" y="506" width="300" height="96" rx="6" class="box"/><text x="212" y="498" class="s" text-anchor="start" xml:space="preserve">U [2 × 3]: one column per token</text><text x="204" y="524" class="tiny" text-anchor="middle" xml:space="preserve">Wait</text><rect x="182" y="530" width="44" height="26" rx="2" class="pos" fill-opacity="1.00"/><text x="204.0" y="547.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="182" y="560" width="44" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="204.0" y="577.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="300" y="524" class="tiny" text-anchor="middle" xml:space="preserve">&lt;/think&gt;</text><rect x="278" y="530" width="44" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="300.0" y="547.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="278" y="560" width="44" height="26" rx="2" class="pos" fill-opacity="1.00"/><text x="300.0" y="577.0" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="396" y="524" class="tiny" text-anchor="middle" xml:space="preserve">So</text><rect x="374" y="530" width="44" height="26" rx="2" class="neg" fill-opacity="1.00"/><text x="396.0" y="547.0" class="num" text-anchor="middle" xml:space="preserve">−1</text><rect x="374" y="560" width="44" height="26" rx="2" class="zero" fill-opacity="1.00"/><text x="396.0" y="577.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="178" y="526" width="52" height="66" rx="4" class="sel"/><text x="196" y="624" class="code" text-anchor="start" xml:space="preserve">logits = h2 @ U = [4.5, −2.5, −4.5]</text><text x="196" y="644" class="tiny" text-anchor="start" xml:space="preserve">"Wait" scores highest, 4.5. u = U[:, Wait] = [1, 0], outlined.</text></svg>
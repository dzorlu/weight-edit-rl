<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 265" role="img"><title>The forward pass of one layer: the residual stream h0 passes through; the MLP computes x from h0, then m = x @ W, which is added back; h @ U gives the logits</title><style>
text{font-family:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink,#1d1d1b)}
.s{font-size:12.5px;fill:var(--muted,#5f5e5a)}.tiny{font-size:11.5px;fill:var(--muted,#5f5e5a)}.accent{fill:var(--accent,#2a78d6)}
.code{font-size:13px;font-family:ui-monospace,Menlo,monospace}.op{font-size:16px;font-weight:600}
.stream{stroke:var(--muted,#5f5e5a);stroke-width:2.5}.ar{stroke:var(--muted,#5f5e5a);stroke-width:1.4;fill:none}.hd{fill:var(--muted,#5f5e5a)}
.box{fill:none;stroke:var(--muted,#5f5e5a);stroke-width:1.2}.xbox{stroke:var(--accent,#2a78d6);stroke-width:1.8}
.op2{fill:var(--code,#efeee9);stroke:var(--line,#d9d7d1)}.tokbg{fill:var(--code,#efeee9)}
.sel{fill:none;stroke:var(--accent,#2a78d6);stroke-width:2}.addc{fill:var(--bg,#fff);stroke:var(--muted,#5f5e5a);stroke-width:1.4}
</style>
<defs><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hd"/></marker></defs><rect x="20" y="10" width="196" height="30" rx="5" class="tokbg"/><text x="30" y="30" class="code" text-anchor="start" xml:space="preserve">… so the answer is 12.</text><rect x="175" y="14" width="34" height="22" rx="4" class="sel"/><text x="226" y="30" class="tiny" text-anchor="start" xml:space="preserve">x is read here, where the next token is "Wait"</text><line x1="160" y1="40" x2="160" y2="76" class="ar" marker-end="url(#hd)"/><rect x="45.0" y="78" width="130" height="44" rx="6" class="box"/><text x="110" y="96" class="s" text-anchor="middle" xml:space="preserve">h0 [3]</text><text x="110" y="114" class="code" text-anchor="middle" xml:space="preserve">[0.5, 0, 0]</text><line x1="175" y1="100" x2="549" y2="100" class="stream"/><text x="360" y="92" class="tiny" text-anchor="middle" xml:space="preserve">residual: passes through unchanged</text><circle cx="560" cy="100" r="11" class="addc"/><text x="560" y="106" class="op" text-anchor="middle" xml:space="preserve">+</text><line x1="571" y1="100" x2="596" y2="100" class="ar" marker-end="url(#hd)"/><rect x="598.0" y="78" width="124" height="44" rx="6" class="box"/><text x="660" y="96" class="s" text-anchor="middle" xml:space="preserve">h [3]</text><text x="660" y="114" class="code" text-anchor="middle" xml:space="preserve">[2, 2, 2.25]</text><line x1="722" y1="100" x2="746" y2="100" class="ar" marker-end="url(#hd)"/><rect x="748.0" y="84" width="54" height="32" rx="16" class="op2"/><text x="775" y="105" class="code" text-anchor="middle" xml:space="preserve">@ U</text><line x1="802" y1="100" x2="826" y2="100" class="ar" marker-end="url(#hd)"/><rect x="828.0" y="78" width="136" height="44" rx="6" class="box"/><text x="896" y="96" class="s" text-anchor="middle" xml:space="preserve">logits [3]</text><text x="896" y="114" class="code" text-anchor="middle" xml:space="preserve">[3, 2, −0.875]</text><text x="896" y="138" class="tiny" text-anchor="middle" xml:space="preserve">Wait, &lt;/think&gt;, So</text><line x1="110" y1="122" x2="110" y2="172" class="ar" marker-end="url(#hd)"/><rect x="64.0" y="174" width="92" height="32" rx="16" class="op2"/><text x="110" y="195" class="code" text-anchor="middle" xml:space="preserve">gate, up</text><line x1="156" y1="190" x2="186" y2="190" class="ar" marker-end="url(#hd)"/><rect x="181.0" y="168" width="134" height="44" rx="6" class="box xbox"/><text x="248" y="186" class="s" text-anchor="middle" xml:space="preserve">x [4]</text><text x="248" y="204" class="code" text-anchor="middle" xml:space="preserve">[1, 2, 1.5, 0.5]</text><line x1="311" y1="190" x2="332" y2="190" class="ar" marker-end="url(#hd)"/><rect x="332.0" y="174" width="60" height="32" rx="16" class="op2"/><text x="362" y="195" class="code" text-anchor="middle" xml:space="preserve">@ W</text><line x1="393" y1="190" x2="406" y2="190" class="ar" marker-end="url(#hd)"/><rect x="408.0" y="168" width="120" height="44" rx="6" class="box"/><text x="468" y="186" class="s" text-anchor="middle" xml:space="preserve">m [3]</text><text x="468" y="204" class="code" text-anchor="middle" xml:space="preserve">[1.5, 2, 2.25]</text><path d="M 529 190 L 560 190 L 560 113" class="ar" fill="none" marker-end="url(#hd)"/><text x="310" y="234" class="tiny" text-anchor="middle" xml:space="preserve">MLP: up to 4 units, then back down to 3 through W</text><text x="362" y="252" class="tiny accent" text-anchor="middle" xml:space="preserve">figure 2 zooms into this box</text></svg>
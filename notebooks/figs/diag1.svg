<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 830" role="img"><title>One layer: activations x times W give m, added to the residual stream; U turns the result into one logit per token</title><style>
text{font-family:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink,#1d1d1b)}
.s{font-size:13px}.tiny{font-size:11.5px;fill:var(--muted,#5f5e5a)}.num{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
.code{font-size:13px;font-family:ui-monospace,Menlo,monospace}.h{font-size:14px;font-weight:600}.op{font-size:17px;font-weight:600}
.stream{stroke:var(--muted,#5f5e5a);stroke-width:3}.ar{stroke:var(--muted,#5f5e5a);stroke-width:1.4;fill:none}.hd{fill:var(--muted,#5f5e5a)}
.axis{stroke:var(--muted,#5f5e5a);stroke-width:1}.box{fill:none;stroke:var(--muted,#5f5e5a);stroke-width:1.2}
.sel{fill:none;stroke:var(--accent,#2a78d6);stroke-width:2.2}.addc{fill:var(--bg,#fff);stroke:var(--muted,#5f5e5a);stroke-width:1.4}
.pos{fill:var(--pos,#2a6fc9)}.neg{fill:var(--neg,#d2601f)}.zero{fill:var(--code,#e9e8e4);stroke:var(--line,#d9d7d1);stroke-width:.6}
.gray{fill:var(--muted,#5f5e5a)}
</style>
<defs><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hd"/></marker></defs><text x="90" y="18" class="h" text-anchor="middle" xml:space="preserve">residual stream</text><rect x="20" y="28" width="140" height="30" rx="5" class="box"/><text x="90" y="48" class="code" text-anchor="middle" xml:space="preserve">h0 = [0.5, 0, 0]</text><line x1="90" y1="58" x2="90" y2="398" class="stream"/><rect x="150" y="84" width="300" height="50" rx="6" class="box"/><text x="160" y="78" class="s" text-anchor="start" xml:space="preserve">W_gate, W_up [3 × 4]: from the stream to the units</text><text x="300" y="106" class="code" text-anchor="middle" xml:space="preserve">x = silu(h0 @ W_gate) * (h0 @ W_up)</text><text x="300" y="124" class="tiny" text-anchor="middle" xml:space="preserve">[3] @ [3 × 4] → [4]</text><line x1="90" y1="109" x2="146" y2="109" class="ar" marker-end="url(#hd)"/><line x1="203" y1="134" x2="203" y2="152" class="ar" marker-end="url(#hd)"/><text x="230" y="166" class="s" text-anchor="middle" xml:space="preserve">x [4]</text><rect x="181" y="180" width="38" height="26" rx="3" class="pos" fill-opacity="0.61"/><text x="200.0" y="197.0" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="172" y="197" class="tiny" text-anchor="end" xml:space="preserve">unit 0</text><rect x="181" y="210" width="38" height="26" rx="3" class="pos" fill-opacity="1.00"/><text x="200.0" y="227.0" class="num" text-anchor="middle" xml:space="preserve">2</text><text x="172" y="227" class="tiny" text-anchor="end" xml:space="preserve">unit 1</text><rect x="181" y="240" width="38" height="26" rx="3" class="pos" fill-opacity="0.80"/><text x="200.0" y="257.0" class="num" text-anchor="middle" xml:space="preserve">1.5</text><text x="172" y="257" class="tiny" text-anchor="end" xml:space="preserve">unit 2</text><rect x="181" y="270" width="38" height="26" rx="3" class="pos" fill-opacity="0.42"/><text x="200.0" y="287.0" class="num" text-anchor="middle" xml:space="preserve">0.5</text><text x="172" y="287" class="tiny" text-anchor="end" xml:space="preserve">unit 3</text><line x1="225" y1="235" x2="262" y2="235" class="ar" marker-end="url(#hd)"/><text x="332" y="166" class="s" text-anchor="middle" xml:space="preserve">W [4 × 3]: one row per unit</text><rect x="266" y="174" width="136" height="128" rx="6" class="box"/><rect x="273" y="180" width="38" height="26" rx="3" class="pos" fill-opacity="0.42"/><text x="292.0" y="197.0" class="num" text-anchor="middle" xml:space="preserve">0.5</text><rect x="315" y="180" width="38" height="26" rx="3" class="zero" fill-opacity="1.00"/><text x="334.0" y="197.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="357" y="180" width="38" height="26" rx="3" class="pos" fill-opacity="0.61"/><text x="376.0" y="197.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="273" y="210" width="38" height="26" rx="3" class="neg" fill-opacity="0.61"/><text x="292.0" y="227.0" class="num" text-anchor="middle" xml:space="preserve">−1</text><rect x="315" y="210" width="38" height="26" rx="3" class="pos" fill-opacity="0.42"/><text x="334.0" y="227.0" class="num" text-anchor="middle" xml:space="preserve">0.5</text><rect x="357" y="210" width="38" height="26" rx="3" class="zero" fill-opacity="1.00"/><text x="376.0" y="227.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="273" y="240" width="38" height="26" rx="3" class="pos" fill-opacity="1.00"/><text x="292.0" y="257.0" class="num" text-anchor="middle" xml:space="preserve">2</text><rect x="315" y="240" width="38" height="26" rx="3" class="pos" fill-opacity="0.61"/><text x="334.0" y="257.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="357" y="240" width="38" height="26" rx="3" class="pos" fill-opacity="0.42"/><text x="376.0" y="257.0" class="num" text-anchor="middle" xml:space="preserve">0.5</text><rect x="273" y="270" width="38" height="26" rx="3" class="zero" fill-opacity="1.00"/><text x="292.0" y="287.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="315" y="270" width="38" height="26" rx="3" class="neg" fill-opacity="0.61"/><text x="334.0" y="287.0" class="num" text-anchor="middle" xml:space="preserve">−1</text><rect x="357" y="270" width="38" height="26" rx="3" class="pos" fill-opacity="0.61"/><text x="376.0" y="287.0" class="num" text-anchor="middle" xml:space="preserve">1</text><line x1="402" y1="235" x2="440" y2="235" class="ar" marker-end="url(#hd)"/><text x="446" y="231" class="code" text-anchor="start" xml:space="preserve">m = x @ W</text><text x="446" y="249" class="code" text-anchor="start" xml:space="preserve">  = [1.5, 2, 2.25]</text><path d="M 470 260 C 470 370, 300 370, 103 370" class="ar" fill="none" marker-end="url(#hd)"/><circle cx="90" cy="370" r="11" class="addc"/><text x="90" y="376" class="op" text-anchor="middle" xml:space="preserve">+</text><text x="108" y="394" class="code" text-anchor="start" xml:space="preserve">h = h0 + m = [2, 2, 2.25]</text><line x1="90" y1="398" x2="90" y2="424" class="ar" marker-end="url(#hd)"/><text x="100" y="432" class="s" text-anchor="start" xml:space="preserve">U [3 × 3]: one column per token</text><rect x="20" y="440" width="250" height="122" rx="6" class="box"/><text x="69" y="458" class="tiny" text-anchor="middle" xml:space="preserve">Wait</text><rect x="50" y="466" width="38" height="26" rx="3" class="pos" fill-opacity="1.00"/><text x="69.0" y="483.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="50" y="496" width="38" height="26" rx="3" class="pos" fill-opacity="0.61"/><text x="69.0" y="513.0" class="num" text-anchor="middle" xml:space="preserve">0.5</text><rect x="50" y="526" width="38" height="26" rx="3" class="zero" fill-opacity="1.00"/><text x="69.0" y="543.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="149" y="458" class="tiny" text-anchor="middle" xml:space="preserve">&lt;/think&gt;</text><rect x="130" y="466" width="38" height="26" rx="3" class="zero" fill-opacity="1.00"/><text x="149.0" y="483.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="130" y="496" width="38" height="26" rx="3" class="pos" fill-opacity="1.00"/><text x="149.0" y="513.0" class="num" text-anchor="middle" xml:space="preserve">1</text><rect x="130" y="526" width="38" height="26" rx="3" class="zero" fill-opacity="1.00"/><text x="149.0" y="543.0" class="num" text-anchor="middle" xml:space="preserve">0</text><text x="229" y="458" class="tiny" text-anchor="middle" xml:space="preserve">So</text><rect x="210" y="466" width="38" height="26" rx="3" class="neg" fill-opacity="1.00"/><text x="229.0" y="483.0" class="num" text-anchor="middle" xml:space="preserve">−1</text><rect x="210" y="496" width="38" height="26" rx="3" class="zero" fill-opacity="1.00"/><text x="229.0" y="513.0" class="num" text-anchor="middle" xml:space="preserve">0</text><rect x="210" y="526" width="38" height="26" rx="3" class="pos" fill-opacity="0.61"/><text x="229.0" y="543.0" class="num" text-anchor="middle" xml:space="preserve">0.5</text><rect x="46" y="462" width="46" height="96" rx="4" class="sel"/><text x="20" y="580" class="tiny" text-anchor="start" xml:space="preserve">u = U[:, Wait] = [1, 0.5, 0], the outlined column</text><line x1="145" y1="592" x2="145" y2="638" class="ar" marker-end="url(#hd)"/><text x="156" y="621" class="code" text-anchor="start" xml:space="preserve">h @ U</text><text x="20" y="654" class="s" text-anchor="start" xml:space="preserve">logits [3]: one per token</text><rect x="20" y="662" width="250" height="80" rx="6" class="box"/><text x="69" y="680" class="tiny" text-anchor="middle" xml:space="preserve">Wait</text><rect x="44" y="688" width="50" height="26" rx="3" class="pos" fill-opacity="1.00"/><text x="69.0" y="705.0" class="num" text-anchor="middle" xml:space="preserve">3</text><text x="149" y="680" class="tiny" text-anchor="middle" xml:space="preserve">&lt;/think&gt;</text><rect x="124" y="688" width="50" height="26" rx="3" class="pos" fill-opacity="0.74"/><text x="149.0" y="705.0" class="num" text-anchor="middle" xml:space="preserve">2</text><text x="229" y="680" class="tiny" text-anchor="middle" xml:space="preserve">So</text><rect x="204" y="688" width="50" height="26" rx="3" class="neg" fill-opacity="0.45"/><text x="229.0" y="705.0" class="num" text-anchor="middle" xml:space="preserve">−0.875</text><rect x="40" y="684" width="58" height="34" rx="4" class="sel"/><text x="20" y="770" class="code" text-anchor="start" xml:space="preserve">h [3] @ U [3 × 3] = logits [3] = [3, 2, −0.875]</text><text x="20" y="792" class="tiny" text-anchor="start" xml:space="preserve">"Wait" scores highest. Its logit is h · u = h0·u + m·u = 0.5 + 2.5 = 3.</text><text x="20" y="810" class="tiny" text-anchor="start" xml:space="preserve">m·u = 2.5 is the layer's part. Figure 2 splits it over the units and weights.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img"><title>The Wait logit split into an embedding part and one part per layer, and each layer part split into one contribution per unit</title><style>
text{font-family:-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink,#1d1d1b)}
.s{font-size:13px}.tiny{font-size:11.5px;fill:var(--muted,#5f5e5a)}.num{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
.code{font-size:13px;font-family:ui-monospace,Menlo,monospace}.h{font-size:14px;font-weight:600}.op{font-size:17px;font-weight:600}
.stream{stroke:var(--muted,#5f5e5a);stroke-width:3}.ar{stroke:var(--muted,#5f5e5a);stroke-width:1.4;fill:none}.hd{fill:var(--muted,#5f5e5a)}
.axis{stroke:var(--muted,#5f5e5a);stroke-width:1}.box{fill:none;stroke:var(--muted,#5f5e5a);stroke-width:1.2}
.sel{fill:none;stroke:var(--accent,#2a78d6);stroke-width:2.2}.addc{fill:var(--bg,#fff);stroke:var(--muted,#5f5e5a);stroke-width:1.4}
.pos{fill:var(--pos,#2a6fc9)}.neg{fill:var(--neg,#d2601f)}.zero{fill:var(--code,#e9e8e4);stroke:var(--line,#d9d7d1);stroke-width:.6}
.gray{fill:var(--muted,#5f5e5a)}
</style>
<defs><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hd"/></marker></defs><text x="0" y="20" class="h" text-anchor="start" xml:space="preserve">1. h2 is a sum, so its dot product with u is a sum of parts</text><text x="0" y="46" class="code" text-anchor="start" xml:space="preserve">logit(Wait) = h2 · u = h0·u + m1·u + m2·u</text><text x="0" y="66" class="code" text-anchor="start" xml:space="preserve">             = 1  +  1  +  2.5  =  4.5</text><rect x="0" y="84" width="70.0" height="28" rx="2" class="zero" fill-opacity="0.45"/><text x="35.0" y="103" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="42" y="130" class="tiny" text-anchor="middle" xml:space="preserve">embedding part</text><rect x="70.0" y="84" width="70.0" height="28" rx="2" class="pos" fill-opacity="0.7"/><text x="105.0" y="103" class="num" text-anchor="middle" xml:space="preserve">1</text><text x="105.0" y="145" class="tiny" text-anchor="middle" xml:space="preserve">layer 1 part</text><rect x="140.0" y="84" width="175.0" height="28" rx="2" class="pos" fill-opacity="0.95"/><text x="227.5" y="103" class="num" text-anchor="middle" xml:space="preserve">2.5</text><text x="227.5" y="130" class="tiny" text-anchor="middle" xml:space="preserve">layer 2 part</text><text x="325.0" y="103" class="code" text-anchor="start" xml:space="preserve">= 4.5</text><text x="0" y="172" class="tiny" text-anchor="start" xml:space="preserve">Each part is one number: m_L and u are both vectors of length 2, and their dot product is a number.</text><text x="0" y="200" class="h" text-anchor="start" xml:space="preserve">2. Split each layer part over the layer's units</text><text x="0" y="226" class="code" text-anchor="start" xml:space="preserve">m_L = x_L @ W_L, so   layer part = m_L · u = x_L @ (W_L @ u) = x_L @ s_L</text><text x="0" y="248" class="code" text-anchor="start" xml:space="preserve">s_L = W_L @ u        [3]  each unit's worth to "Wait" per unit of activation</text><text x="0" y="268" class="code" text-anchor="start" xml:space="preserve">contrib_L = x_L * s_L  [3]  what each unit added here; sum(contrib_L) = layer part</text><text x="0" y="300" class="h" text-anchor="start" xml:space="preserve">layer 1</text><text x="0" y="318" class="code" text-anchor="start" xml:space="preserve">x1 = [2, 0, −1]   s1 = W1 @ u = [1, 0, 1]</text><text x="0" y="346" class="tiny" text-anchor="start" xml:space="preserve">unit 0</text><rect x="120" y="332" width="120.0" height="18" rx="2" class="pos" fill-opacity="0.85"/><text x="248.0" y="346" class="tiny" text-anchor="start" xml:space="preserve">contrib = 2 × 1 = 2</text><text x="0" y="372" class="tiny" text-anchor="start" xml:space="preserve">unit 1</text><rect x="120" y="358" width="1.5" height="18" rx="2" class="zero" fill-opacity="0.85"/><text x="128.0" y="372" class="tiny" text-anchor="start" xml:space="preserve">contrib = 0 × 0 = 0</text><text x="0" y="398" class="tiny" text-anchor="start" xml:space="preserve">unit 2</text><rect x="60.0" y="384" width="60.0" height="18" rx="2" class="neg" fill-opacity="0.85"/><text x="128" y="398" class="tiny" text-anchor="start" xml:space="preserve">contrib = −1 × 1 = −1</text><line x1="120" y1="328" x2="120" y2="412" class="axis"/><text x="0" y="430" class="s" text-anchor="start" xml:space="preserve">sum = 1 = layer 1 part</text><text x="0" y="462" class="h" text-anchor="start" xml:space="preserve">layer 2</text><text x="0" y="480" class="code" text-anchor="start" xml:space="preserve">x2 = [0, 1, 3]   s2 = W2 @ u = [0, 1, 0.5]</text><text x="0" y="508" class="tiny" text-anchor="start" xml:space="preserve">unit 0</text><rect x="120" y="494" width="1.5" height="18" rx="2" class="zero" fill-opacity="0.85"/><text x="128.0" y="508" class="tiny" text-anchor="start" xml:space="preserve">contrib = 0 × 0 = 0</text><text x="0" y="534" class="tiny" text-anchor="start" xml:space="preserve">unit 1</text><rect x="120" y="520" width="60.0" height="18" rx="2" class="pos" fill-opacity="0.85"/><text x="188.0" y="534" class="tiny" text-anchor="start" xml:space="preserve">contrib = 1 × 1 = 1</text><text x="0" y="560" class="tiny" text-anchor="start" xml:space="preserve">unit 2</text><rect x="120" y="546" width="90.0" height="18" rx="2" class="pos" fill-opacity="0.85"/><text x="218.0" y="560" class="tiny" text-anchor="start" xml:space="preserve">contrib = 3 × 0.5 = 1.5</text><line x1="120" y1="490" x2="120" y2="574" class="axis"/><text x="0" y="592" class="s" text-anchor="start" xml:space="preserve">sum = 2.5 = layer 2 part</text></svg>
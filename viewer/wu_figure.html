<!-- Interactive single-layer figure: x [M] * W [M, D] * u [D] = contribution of each weight to the "Wait" logit [M, D], with row sums. Spliced into posts/weight-edits/index.html. -->
<div class="wu" id="wu">
  <div class="wu-row">
    <div class="wu-block"><div class="wu-cap"><code>x</code> [4]</div><div class="wu-sp"></div><div class="wu-col" id="wu-x"></div></div>
    <div class="wu-op">*</div>
    <div class="wu-block"><div class="wu-cap"><code>W</code> [4 × 3]</div><div class="wu-sp"></div><div class="wu-grid" id="wu-W"></div></div>
    <div class="wu-op">*</div>
    <div class="wu-block">
      <div class="wu-cap"><code>U</code> [3 × 3]</div>
      <div class="wu-tok" id="wu-Uh"></div><div class="wu-ugrid" id="wu-U"></div>
    </div>
    <div class="wu-op">=</div>
    <div class="wu-block"><div class="wu-cap">contribution to "Wait" [4 × 3]</div><div class="wu-sp"></div><div class="wu-grid" id="wu-C"></div></div>
    <div class="wu-op wu-sumop">sum<br>row</div>
    <div class="wu-block"><div class="wu-cap">row contribution [4]</div><div class="wu-sp"></div><div class="wu-col" id="wu-S"></div><div class="wu-tot" id="wu-T"></div></div>
  </div>
  <div class="wu-total" id="wu-total"></div>
  <div class="wu-read" id="wu-read" aria-live="polite">Hover a cell of <code>W</code> for one weight, or a unit on the right for its row.</div>
</div>
<noscript><p>The figure needs JavaScript. x = [1, 2, 1.5, 0.5]; W rows [0.5, 0, 1], [−1, 0.5, 0], [2, 1, 0.5], [0, −1, 1]; u = [1, 0.5, 0]. Contribution rows [0.5, 0, 0], [−2, 0.5, 0], [3, 0.75, 0], [0, −0.25, 0]; per unit 0.5, −1.5, 3.75, −0.25; layer total 2.5.</p></noscript>
<style>
.dfig:has(> .wu){overflow:visible}
.wu{margin:16px 0 8px;padding:12px;border:1px solid var(--line);border-radius:8px;overflow-x:auto;box-sizing:border-box;position:relative;width:min(1000px,calc(100vw - 32px));left:50%;transform:translateX(-50%);background:var(--bg)}
.wu-row{display:flex;align-items:flex-start;gap:8px;min-width:820px;justify-content:center}
.wu-block{display:flex;flex-direction:column;gap:4px}
.wu-cap{font-size:12.5px;color:var(--muted);height:18px;white-space:nowrap}
.wu-ucap{margin-top:14px;font-size:11px}
.wu-sp{height:2px}
.wu-grid{display:grid;grid-template-columns:repeat(3,50px);gap:3px}
.wu-col{display:grid;grid-template-columns:50px;gap:3px}
.wu-tok{display:grid;grid-template-columns:repeat(3,50px);gap:3px;font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap}
.wu-tok div{overflow:hidden}
.wu-ugrid{display:grid;grid-template-columns:repeat(3,50px);gap:3px}
.wu .c{height:34px;display:flex;align-items:center;justify-content:center;font:12px ui-monospace,Menlo,monospace;border-radius:4px;color:var(--ink);outline:none;transition:opacity .12s}
.wu .c.h{cursor:pointer}
.wu-ugrid .c{height:34px}
#wu-S .c{border:1px solid var(--line);font-weight:600}
#wu-u .c{border:1px solid var(--line);font-weight:600}
.wu .c.wait{box-shadow:inset 0 0 0 2px var(--accent)}
.wu .c.dim{opacity:.22}
.wu .c.hi{box-shadow:0 0 0 2.5px var(--accent);opacity:1}
.wu .c:focus-visible{box-shadow:0 0 0 2.5px var(--accent)}
.wu-op{align-self:flex-start;margin-top:74px;min-width:14px;text-align:center;font:600 18px ui-monospace,Menlo,monospace;color:var(--ink)}
.wu-sumop{font:12px -apple-system,system-ui,sans-serif;color:var(--muted);margin-top:68px}
.wu-total{margin-top:14px;font-size:14px}
.wu-tot{margin-top:8px;font-size:12px;color:var(--muted);width:150px}
.wu-trow{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.wu-trow b{font:600 12.5px ui-monospace,Menlo,monospace;color:var(--ink)}
.wu-final{border-top:1px solid var(--line);margin-top:2px;padding-top:4px;color:var(--ink)}
.wu-read{margin-top:6px;font-size:15px;min-height:1.5em}
</style>
<script>
(function () {
  const W = [[0.5, 0, 1], [-1, 0.5, 0], [2, 1, 0.5], [0, -1, 1]], x = [1, 2, 1.5, 0.5];
  const U = [[1, 0, -1], [0.5, 1, 0], [0, 0, 0.5]], u = U.map(r => r[0]);
  const C = W.map((r, j) => r.map((v, d) => x[j] * v * u[d]));
  const S = C.map(r => r.reduce((a, b) => a + b, 0)), total = S.reduce((a, b) => a + b, 0);
  const fmt = v => (Math.abs(v) < 1e-9 ? 0 : Math.round(v * 1000) / 1000).toString().replace('-', '−');
  const tint = (v, vmax) => Math.abs(v) < 1e-9 ? 'var(--code)' :
    `color-mix(in srgb, ${v > 0 ? 'var(--pos)' : 'var(--neg)'} ${Math.round(20 + 70 * Math.min(1, Math.abs(v) / vmax))}%, transparent)`;
  const $ = id => document.getElementById(id), all = [];
  const cell = (parent, v, vmax, hover) => {
    const c = document.createElement('div'); c.className = 'c' + (hover ? ' h' : ''); c.textContent = fmt(v);
    if (hover) c.tabIndex = 0;
    if (vmax) c.style.background = tint(v, vmax); parent.appendChild(c); all.push(c); return c;
  };
  const cx = x.map(v => cell($('wu-x'), v, 0, true));
  const cW = W.map(r => r.map(v => cell($('wu-W'), v, 2, true)));
  $('wu-Uh').innerHTML = ['Wait', '&lt;/think&gt;', 'So'].map(n => `<div>${n}</div>`).join('');
  const cU = U.map(r => r.map(v => cell($('wu-U'), v, 1, false)));
  $('wu-U').style.marginTop = '0';
  cU.forEach(r => r[0].classList.add('wait'));
  const cC = C.map(r => r.map(v => cell($('wu-C'), v, 3, true)));
  const cS = S.map(v => cell($('wu-S'), v, 3, true));
  const top = S.indexOf(Math.max(...S));
  const idle = 'Hover a cell of <code>W</code> for one weight, or a unit on the right for its row.';
  $('wu-T').innerHTML = `<div class="wu-trow"><span>sum</span><b>${fmt(total)}</b></div><div class="wu-trow"><span>+ residual h0·u</span><b>0.5</b></div><div class="wu-trow wu-final"><span>= Wait logit</span><b>${fmt(total + 0.5)}</b></div>`;
  $('wu-total').innerHTML = `The rows add up to <b>${fmt(total)}</b>, this layer's part of the "Wait" logit. Adding the residual's 0.5 gives the logit, <b>${fmt(total + 0.5)}</b>, as in figure 1. Unit ${top} contributes the most, ${fmt(S[top])}: the row to delete or edit.`;
  const light = list => { all.forEach(c => c.classList.add('dim')); list.forEach(c => { c.classList.remove('dim'); c.classList.add('hi'); }); };
  const reset = () => { all.forEach(c => c.classList.remove('dim', 'hi')); $('wu-read').innerHTML = idle; };
  const showCell = (j, d) => {
    reset(); light([cx[j], cW[j][d], cU[d][0], cC[j][d]]);
    $('wu-read').innerHTML = `W[${j}][${d}]: x[${j}] × W[${j}][${d}] × U[${d}][Wait] = ${fmt(x[j])} × ${fmt(W[j][d])} × ${fmt(u[d])} = <b>${fmt(C[j][d])}</b>`;
  };
  const showRow = j => {
    reset(); light([cx[j], ...cW[j], ...cU.map(r => r[0]), ...cC[j], cS[j]]);
    $('wu-read').innerHTML = `Unit ${j}, row ${j} of W: ${C[j].map(fmt).join(' + ')} = <b>${fmt(S[j])}</b>`;
  };
  const on = (c, f) => ['mouseenter', 'focus', 'click'].forEach(e => c.addEventListener(e, f));
  cW.forEach((r, j) => r.forEach((c, d) => on(c, () => showCell(j, d))));
  cC.forEach((r, j) => r.forEach((c, d) => on(c, () => showCell(j, d))));
  cS.forEach((c, j) => on(c, () => showRow(j)));
  cx.forEach((c, j) => on(c, () => showRow(j)));
  $('wu').addEventListener('mouseleave', reset);
  reset();
})();
</script>
